<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NiRi — Pengujian Statistik &amp; Grafik</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    body {
      margin: 0;
      padding: var(--space-6);
      background-color: var(--bg-page);
      color: var(--ink);
      font-family: var(--font-body);
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    h1, h2 {
      font-family: var(--font-heading);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 0;
    }
    .panel {
      background: var(--surface-cream);
      border: var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: var(--space-6);
      margin-bottom: var(--space-6);
    }
    .summary-badge {
      display: inline-block;
      padding: var(--space-2) var(--space-4);
      border: 2px solid var(--ink);
      border-radius: var(--radius-pill);
      font-weight: bold;
      margin-bottom: var(--space-4);
    }
    .badge-success {
      background: var(--success);
      color: var(--success-ink);
    }
    .badge-danger {
      background: var(--danger);
      color: var(--danger-ink);
    }
    .test-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: var(--space-2);
      font-family: var(--font-mono);
      font-size: var(--text-sm);
    }
    .test-item {
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-input);
      border: 1px solid var(--ink);
      background: var(--surface-cream);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-pass {
      border-left: 6px solid var(--success);
    }
    .test-fail {
      border-left: 6px solid var(--danger);
      background: var(--pink-light);
    }
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--space-6);
      margin-top: var(--space-6);
    }
    .chart-card {
      background: var(--surface-cream);
      border: var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: var(--space-4);
    }
    svg {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="panel">
      <h1>Pengujian Statistik &amp; Grafik NiRi</h1>
      <p>Verifikasi mandiri modul <code>StatsService</code>, komponen SVG murni <code>charts.js</code>, dan dataset <code>data/seed.json</code>.</p>
      <div id="summary">Memuat pengujian…</div>
      <ul id="test-list" class="test-list"></ul>
    </header>

    <section class="panel">
      <h2>Pratinjau Visual Komponen Grafik</h2>
      <div class="charts-grid" id="charts-preview"></div>
    </section>
  </div>

  <script type="module">
    import { runStatsTests } from './stats-tests.js';
    import { donutChart, barChart, workloadChart, projectProgressChart } from '../js/components/charts.js';

    const listElement = document.querySelector('#test-list');
    const summaryElement = document.querySelector('#summary');

    const result = await runStatsTests({
      report: ({ name, passed, error }) => {
        const item = document.createElement('li');
        item.className = `test-item ${passed ? 'test-pass' : 'test-fail'}`;
        item.innerHTML = `<span>${name}</span><strong>${passed ? 'LULUS' : 'GAGAL'}</strong>`;
        if (error) {
          const detail = document.createElement('div');
          detail.textContent = error;
          detail.style.color = 'var(--danger-ink)';
          item.append(detail);
        }
        listElement.append(item);
      }
    });

    summaryElement.innerHTML = `<span class="summary-badge ${result.failed === 0 ? 'badge-success' : 'badge-danger'}">${result.passed} Lulus, ${result.failed} Gagal dari ${result.total} Pengujian</span>`;

    const preview = document.querySelector('#charts-preview');
    preview.innerHTML = `
      <div class="chart-card">
        <h3>Status Tugas (Donat)</h3>
        ${donutChart({ todo: 8, in_progress: 6, review: 4, done: 6 })}
      </div>
      <div class="chart-card">
        <h3>Prioritas Tugas (Batang)</h3>
        ${barChart({ low: 6, medium: 8, high: 6, critical: 4 })}
      </div>
      <div class="chart-card">
        <h3>Beban Kerja Tim</h3>
        ${workloadChart([
          { userId: 'u1', name: 'Bima Nugraha', active: 5, overdue: 2 },
          { userId: 'u2', name: 'Citra Dewi', active: 4, overdue: 1 },
          { userId: 'u3', name: 'Dimas Prasetyo', active: 2, overdue: 0 }
        ])}
      </div>
      <div class="chart-card">
        <h3>Progres Proyek</h3>
        ${projectProgressChart([
          { id: 'p1', name: 'Sistem Akademik', done: 3, total: 9, percentage: 33 },
          { id: 'p2', name: 'Digitalisasi UMKM', done: 2, total: 8, percentage: 25 },
          { id: 'p3', name: 'Inventaris Lab', done: 1, total: 7, percentage: 14 }
        ])}
      </div>
    `;
  </script>
</body>
</html>
